name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  stt:
    name: Python STT
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/stt
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.11.32
      - name: Install STT dependencies
        run: uv sync --frozen --group dev
      - name: Test STT without model downloads
        run: uv run --frozen pytest
        env:
          HF_HUB_OFFLINE: '1'
  ci:
    name: CI
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  public:
    name: Public checks
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run test:public
      - run: npm run test:cd
      - name: Public build with a non-deployable fixture
        shell: pwsh
        run: |
          node scripts/staging-cd.mjs fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:VAYRIA_PUBLIC_VRM = Join-Path $PWD '.wrangler/ci-model.vrm'
          npm run public:build
      - run: npm run public:check
      - run: npm run production:check
      - run: npm run production:recovery:check

  deploy-staging:
    name: Deploy staging
    needs: [ci, stt, public]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 20
    environment:
      name: staging
      url: https://staging.vayria.me
    concurrency:
      group: vayria-staging-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Fetch and verify pinned private VRM
        run: node scripts/staging-cd.mjs download
        env:
          GH_TOKEN: ${{ secrets.VAYRIA_ASSETS_READ_TOKEN }}
      - name: Build deployable public assets
        run: npm run public:build
        env:
          VAYRIA_PUBLIC_VRM: .wrangler/public-vrm/model.vrm
      - run: npm run public:check
      - name: Verify current main and deploy staging
        run: node scripts/staging-cd.mjs deploy
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify staging access gate
        run: node scripts/staging-cd.mjs smoke
      - name: Remove private files from runner
        if: always()
        shell: pwsh
        run: |
          $workspaceRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          foreach ($relative in @('.wrangler/public-vrm', '.public-assets', 'dist-public')) {
            $target = [IO.Path]::GetFullPath((Join-Path $workspaceRoot $relative))
            if (-not $target.StartsWith($workspaceRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) { throw 'Invalid cleanup target' }
            if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          }

  deploy-production:
    name: Deploy production
    needs: [ci, stt, public, deploy-staging]
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true' && needs['deploy-staging'].result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 20
    environment:
      name: production
      url: https://vayria.me
    concurrency:
      group: vayria-production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Fetch and verify pinned private VRM
        run: node scripts/production-cd.mjs download
        env:
          GH_TOKEN: ${{ secrets.VAYRIA_ASSETS_READ_TOKEN }}
      - name: Build deployable public assets
        run: npm run public:build
        env:
          VAYRIA_PUBLIC_VRM: .wrangler/public-vrm/model.vrm
      - run: npm run production:check
      - name: Verify current main and deploy production
        run: node scripts/production-cd.mjs deploy
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          STAGING_RESULT: ${{ needs['deploy-staging'].result }}
      - name: Verify production without paid generation
        run: node scripts/production-cd.mjs smoke
      - name: Remove private files from runner
        if: always()
        shell: pwsh
        run: |
          $workspaceRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          foreach ($relative in @('.wrangler/public-vrm', '.public-assets', 'dist-public')) {
            $target = [IO.Path]::GetFullPath((Join-Path $workspaceRoot $relative))
            if (-not $target.StartsWith($workspaceRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) { throw 'Invalid cleanup target' }
            if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          }
