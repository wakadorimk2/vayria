name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  stt:
    name: Python STT
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/stt
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.11.32
      - name: Install STT dependencies
        run: uv sync --frozen --group dev
      - name: Test STT without model downloads
        run: uv run --frozen pytest
        env:
          HF_HUB_OFFLINE: '1'
  ci:
    name: CI
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
