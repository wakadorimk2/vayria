name: Staging preview

on:
  pull_request_target:
    branches: [main]
    types: [labeled, unlabeled, closed]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions: {}
# Serialize preview selection and publication. Main uses a separate drain gate,
# so a queued preview cannot evict the pending main deployment from a concurrency group.
concurrency:
  group: vayria-staging-preview
  cancel-in-progress: false

jobs:
  select:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    outputs:
      selected: ${{ steps.select.outputs.selected }}
      sha: ${{ steps.select.outputs.sha }}
      main: ${{ steps.select.outputs.main }}
      pr: ${{ steps.select.outputs.pr }}
      labelId: ${{ steps.select.outputs.labelId }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.x'
      - id: select
        run: node scripts/staging-preview.mjs select
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: select
    if: needs.select.outputs.selected == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.select.outputs.main }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.select.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.x'
      - run: npm ci --ignore-scripts
        working-directory: control
      - name: Build selected code without deployment credentials
        shell: pwsh
        working-directory: source
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/staging-cd.mjs fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:VAYRIA_PUBLIC_VRM = Join-Path $PWD '.wrangler/ci-model.vrm'
          npm run public:build
          exit $LASTEXITCODE
      - run: node scripts/staging-preview-package.mjs pack ../source ../package
        working-directory: control
      - uses: actions/upload-artifact@v4
        with:
          name: preview-package
          path: package
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: [select, build]
    runs-on: windows-2025
    timeout-minutes: 10
    environment:
      name: staging
      url: https://staging.vayria.me
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      deployments: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.select.outputs.main }}
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.x'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: preview-package
          path: incoming
      - name: Download pinned avatar using main code only
        run: node scripts/staging-cd.mjs download
        env:
          GH_TOKEN: ${{ secrets.VAYRIA_ASSETS_READ_TOKEN }}
      - name: Validate selection and deploy only staging
        run: node scripts/staging-preview-package.mjs deploy incoming
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_SELECTION: '{"pr":${{ needs.select.outputs.pr }},"sha":"${{ needs.select.outputs.sha }}","main":"${{ needs.select.outputs.main }}","labelId":${{ needs.select.outputs.labelId }}}'

      - name: Remove deployment files
        if: always()
        shell: pwsh
        run: |
          $workspaceRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          foreach ($relative in @('.wrangler/public-vrm', 'incoming')) {
            $target = [IO.Path]::GetFullPath((Join-Path $workspaceRoot $relative))
            if (-not $target.StartsWith($workspaceRoot + [IO.Path]::DirectorySeparatorChar)) { throw 'Invalid cleanup path' }
            if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          }
