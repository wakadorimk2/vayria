<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Vayria — 公開準備中</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #34313d;
        background: #f8f6f3;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
      }
      main { width: 100%; max-width: 36rem; text-align: center; }
      h1 {
        margin: 0 0 1.5rem;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3rem, 12vw, 5rem);
        font-weight: 400;
        letter-spacing: 0.04em;
        line-height: 1.2;
      }
      p { margin: 0; font-size: 1rem; line-height: 1.8; }
    </style>
  </head>
  <body>
    <main>
      <h1>Vayria</h1>
      <p>ただいま公開準備中です</p>
    </main>
  </body>
</html>
